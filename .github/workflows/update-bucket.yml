name: Update personal Scoop bucket

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: windows-latest
    steps:
      - name: Check out bucket
        uses: actions/checkout@v4

      - name: Update manifests
        shell: pwsh
        run: .\tools\Update-Bucket.ps1 -Apply

      - name: Commit manifest changes
        shell: pwsh
        run: |
          $changed = git status --short -- bucket
          if (-not $changed) {
            Write-Host 'Bucket is already current.'
            exit 0
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add bucket
          git commit -m 'Update personal Scoop bucket manifests'
          git push
